name: Research simulator persona selection
on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-simulator-personas.yml]
permissions:
  contents: read
concurrency:
  group: research-simulator-personas
  cancel-in-progress: false

jobs:
  select:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch pinned persona source and blinded selector
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git init -q matraix
          git -C matraix remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
          git -C matraix fetch --depth 1 origin 3633d8dab149a9482a71b024418a49ae828cc941
          git -C matraix checkout --detach FETCH_HEAD
          curl -fsSL --max-time 90 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/c302f99ee9746d2f959d9ac651a592bc64dc3fba/research/simulator_v017/select_personas.py -o select_personas.py
          python -m pip install --quiet --no-cache-dir 'PyYAML==6.0.3'
          python select_personas.py --dataset matraix/persona/datasets/matraix-persona-dev-sample --out persona-selection.json
          mkdir evidence
          cp persona-selection.json select_personas.py evidence/
          python - <<'PY'
          import json, shutil, pathlib
          j=json.load(open('persona-selection.json'))
          root=pathlib.Path('matraix/persona/datasets/matraix-persona-dev-sample')
          out=pathlib.Path('evidence')
          for x in j['selected']:
              shutil.copy2(root/f"persona_{x['persona_id']}.yaml", out)
          PY
          sha256sum evidence/* > evidence/SHA256SUMS
      - name: Preserve persona selection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-simulator-persona-selection
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: error