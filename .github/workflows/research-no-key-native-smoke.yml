name: Research no-key native connectivity

on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-no-key-native-smoke.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: research-no-key-native-connectivity
  cancel-in-progress: false

jobs:
  native-connectivity:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONUNBUFFERED: '1'
      NATIVE_PIN: 3633d8dab149a9482a71b024418a49ae828cc941
    steps:
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch pinned public native source and replay client
        shell: bash
        run: |
          set -euo pipefail
          export NATIVE="$RUNNER_TEMP/matraix-native"
          mkdir -p "$NATIVE"
          git -C "$NATIVE" init -q
          git -C "$NATIVE" remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
          git -C "$NATIVE" fetch --depth 1 origin "$NATIVE_PIN"
          git -C "$NATIVE" checkout --detach FETCH_HEAD
          test "$(git -C "$NATIVE" rev-parse HEAD)" = "$NATIVE_PIN"
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/8101873590dba1e7613c36049e9e50415ab6bd66/research/connectivity/native_replay_v1.py -o "$RUNNER_TEMP/native_replay_v1.py"
          echo "6032365bd6e4d010087ed7ad531de97209021400c9056a25951cbc562cb403f8  $RUNNER_TEMP/native_replay_v1.py" | sha256sum --check -
          python -m py_compile "$RUNNER_TEMP/native_replay_v1.py"
      - name: Install native runtime only; no model weights or inference engine
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir "$NATIVE"
          python -m pip freeze
      - name: Replay two retained real outputs; do not generate new responses
        shell: bash
        env:
          GH_LOG_READ_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/native_replay_v1.py"
