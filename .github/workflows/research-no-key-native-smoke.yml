name: Research no-key native connectivity

on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-no-key-native-smoke.yml]

permissions:
  contents: read

concurrency:
  group: research-no-key-native-connectivity
  cancel-in-progress: false

jobs:
  native-connectivity:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      NATIVE_PIN: 3633d8dab149a9482a71b024418a49ae828cc941
    steps:
      - name: Set up isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch pinned public native source and test client
        shell: bash
        run: |
          set -euo pipefail
          export NATIVE="$RUNNER_TEMP/matraix-native"
          mkdir -p "$NATIVE"
          git -C "$NATIVE" init -q
          git -C "$NATIVE" remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
          git -C "$NATIVE" fetch --depth 1 origin "$NATIVE_PIN"
          git -C "$NATIVE" checkout --detach FETCH_HEAD
          test "$(git -C "$NATIVE" rev-parse HEAD)" = "$NATIVE_PIN"
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/669ef763e864ae60d5e25d9d68e99fc610c8c3b0/research/connectivity/native_cpu_v2.py -o "$RUNNER_TEMP/native_cpu_v2.py"
          sha256sum "$RUNNER_TEMP/native_cpu_v2.py"
          python -m py_compile "$RUNNER_TEMP/native_cpu_v2.py"
      - name: Install CPU runtime and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.56.2' "$NATIVE"
          python -m pip freeze
      - name: Execute bounded v2 native calls without answer repair or retries
        shell: bash
        run: python "$RUNNER_TEMP/native_cpu_v2.py"
