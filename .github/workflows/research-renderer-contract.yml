name: Research native renderer contract
on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-renderer-contract.yml]
permissions:
  contents: read
jobs:
  renderer:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch source and install renderer dependencies only
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/native"
          git -C "$RUNNER_TEMP/native" remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
          git -C "$RUNNER_TEMP/native" fetch --depth 1 origin 3633d8dab149a9482a71b024418a49ae828cc941
          git -C "$RUNNER_TEMP/native" checkout --detach FETCH_HEAD
          python -m pip install --quiet --no-cache-dir "$RUNNER_TEMP/native"
          curl -fsSL https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/693eb0bf0000ddb60d684f45d8b5c7b08c4057c0/research/qualification/qualification.py -o "$RUNNER_TEMP/qualification.py"
          echo "885ca37a544577ef708837140834c348c18477db54c301bb4689b07f751ac90e  $RUNNER_TEMP/qualification.py" | sha256sum --check -
      - name: Test actual lookup and exact instructions without inference
        run: |
          python - <<'PY'
          import os, sys, json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'native'
          sys.path[:0]=[str(root/p) for p in ('.','src','environment/runtime','environment/agents','packages/playground/src','application/playground')]
          sys.path.append(os.environ['RUNNER_TEMP'])
          os.chdir(root)
          import qualification as q
          from playground.inprocess.survey_eval import build_survey_task_prompt
          from playground.survey_task_content import load_survey_task_content_for_task_path as load
          def prompt(p): return build_survey_task_prompt(instrument=load(str(p),repo_root=root).instrument)
          a=q.task_write(root,'task-legacy-probe',q.cases()[0]['case'],'PUBLIC_PROTOCOL_SENTINEL',q.response_schema())
          legacy={'instruction_retained':a[2] in prompt(a[0]),'context_retained':a[3] in prompt(a[0])}
          probes=[]
          for i in (0,1):
              p=q.task_write(root,'survey_collision_'+str(i),q.cases()[i]['case'],'PUBLIC_PROTOCOL_SENTINEL',q.response_schema())
              fn=p[0]/'input/questionnaire.yaml';d=json.loads(fn.read_text());d['id']='same_questionnaire_id';fn.write_text(q.canon(d));probes.append(p)
          before=[{'own_instruction':p[2] in prompt(p[0]),'own_case':p[3] in prompt(p[0])} for p in probes]
          for i,p in enumerate(probes):
              fn=p[0]/'input/questionnaire.yaml';d=json.loads(fn.read_text());d['id']='unique_questionnaire_'+str(i);fn.write_text(q.canon(d))
          after=[{'own_instruction':p[2] in prompt(p[0]),'own_case':p[3] in prompt(p[0])} for p in probes]
          result={'native_pin':q.PIN,'legacy_prefix':legacy,'duplicate_id':before,'unique_ids':after,'model_calls':0,'expected_reproduction':not legacy['instruction_retained'] and not before[1]['own_case'] and all(x['own_case'] and x['own_instruction'] for x in after),'native_source_modified':False}
          print('HARD_RENDERER_JSON '+q.canon(result))
          assert result['expected_reproduction']
          PY
