name: Report Grade Regression

on:
  push:
    branches:
      - feature/hard-grade-mvp
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --group dev
      - name: Report-grade regressions
        run: uv run pytest -q tests/test_report_grade.py
      - name: Full regressions
        run: uv run pytest -q
