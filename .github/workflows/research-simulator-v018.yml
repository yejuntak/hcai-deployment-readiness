name: Research simulator v0.1.8 qualification
on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-simulator-v018.yml]
permissions:
  contents: read
concurrency:
  group: research-simulator-v018
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONUNBUFFERED: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch frozen instrument and pinned Qwen2.5 14B candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p code evidence bin
          for f in simulator.py qualify.py; do
            curl -fsSL --max-time 90 "https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/e81c862d63d38492ee5228c148cf6ca3563313ca/research/simulator_v010/$f" -o "code/$f"
          done
          curl -fsSL --max-time 90 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/85738b4d7b503ca11cc2f03678fd9733adefb8ba/research/simulator_v011/apply_limits.py -o code/apply_limits.py
          curl -fsSL --max-time 90 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/85738b4d7b503ca11cc2f03678fd9733adefb8ba/research/simulator_v011/qualification.py -o code/qualification_base.py
          for f in apply_semantics.py qualification.py; do
            curl -fsSL --max-time 90 "https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/8afcaa9cbb4efb4b86ae395d1e1175bf68eab9ec/research/simulator_v013/$f" -o "code/$f"
          done
          curl -fsSL --max-time 90 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/8ffdd062c496ee5b9ec155b22d5985dcc1bad1f8/research/simulator_v018/apply_runtime.py -o code/apply_runtime.py
          (cd code && python apply_limits.py && python apply_semantics.py && python apply_runtime.py)
          python -m py_compile code/simulator.py code/qualification.py

          curl -fsSL --max-time 90 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/f6c61a2137c482e85c6562cf28afd9f72f320738/protocol/0.3-preview.1/PROTOCOL.md -o PROTOCOL.md
          echo '5d40c01356e82981de5a88d4e3c5119f5468be263064488e644e8da19a024260  PROTOCOL.md' | sha256sum --check -

          curl -fsSL --max-time 180 https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-ubuntu-x64.tar.gz -o llama.tar.gz
          echo 'c150306eb16b5ab696f76a8bdf810c35fd98a24e82158742e6fa28f420ff8410  llama.tar.gz' | sha256sum --check -
          tar -xzf llama.tar.gz -C bin

          for n in 00001 00002 00003; do
            curl -fsSL --max-time 1200 "https://huggingface.co/Qwen/Qwen2.5-14B-Instruct-GGUF/resolve/2b6a96d780143b4e8e3b970394e39e3774551f29/qwen2.5-14b-instruct-q4_k_m-${n}-of-00003.gguf" -o "qwen2.5-14b-instruct-q4_k_m-${n}-of-00003.gguf"
          done
          echo 'a09ea5e7b1eafb1b30b241726c3cc3c905c96f14ad41e246ffa5f44e53904f68  qwen2.5-14b-instruct-q4_k_m-00001-of-00003.gguf' | sha256sum --check -
          echo '21b9457d079680d284e90ef69607c4b2d8ef64a09d4729cb7b5e1357bdba41ae  qwen2.5-14b-instruct-q4_k_m-00002-of-00003.gguf' | sha256sum --check -
          echo 'c8d37006760a387a35216e070e6664d7da927f10be8eb870fef2e3d4833d9976  qwen2.5-14b-instruct-q4_k_m-00003-of-00003.gguf' | sha256sum --check -
          sha256sum qwen2.5-14b-instruct-q4_k_m-*.gguf > evidence/model.sha256

          python -m pip install --quiet --no-cache-dir 'jsonschema==4.26.0'
          if [ "$SHARD" = '1' ]; then
            git init -q native
            git -C native remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
            git -C native fetch --depth 1 origin 3633d8dab149a9482a71b024418a49ae828cc941
            git -C native checkout --detach FETCH_HEAD
            python -m pip install --quiet --no-cache-dir ./native
          fi
          python -m pip freeze > evidence/pip-freeze.txt
          cp code/*.py PROTOCOL.md evidence/
          find bin -type f -exec sha256sum {} \; > evidence/runtime-files.sha256

      - name: Execute same sixteen-case partition without retries
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          SERVER=$(find "$RUNNER_TEMP/bin" -type f -name llama-server | head -1)
          export LD_LIBRARY_PATH="$(dirname "$SERVER"):${LD_LIBRARY_PATH:-}"
          "$SERVER" --model qwen2.5-14b-instruct-q4_k_m-00001-of-00003.gguf --alias research-sim-qwen25-14b-q4 --host 127.0.0.1 --port 8765 --ctx-size 8192 --parallel 1 --threads 4 --threads-batch 4 --no-context-shift > evidence/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8765/health >/dev/null && break
            kill -0 "$PID" || { cat evidence/server.log; exit 1; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/props > evidence/server-props.json
          python code/qualification.py --protocol PROTOCOL.md --native native --shard "$SHARD" --out evidence/qualification | tee evidence/qualification.log

      - name: Preserve raw evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-simulator-v018-qualification-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: error
