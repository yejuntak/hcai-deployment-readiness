name: Research full-input qualification
on:
  push:
    branches: [research/no-key-native-smoke-20260928]
    paths: [.github/workflows/research-full-input-qualification.yml]
permissions:
  contents: read
concurrency:
  group: research-full-input-qualification
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository_visibility == 'public' && github.repository == 'yejuntak/hcai-deployment-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [Qwen/Qwen3-0.6B, Qwen/Qwen3-1.7B]
    env:
      QUAL_MODEL: ${{ matrix.model }}
      NATIVE_PIN: 3633d8dab149a9482a71b024418a49ae828cc941
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Get pinned sources without credentials
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="$RUNNER_TEMP/matraix-native"
          mkdir "$NATIVE"
          git -C "$NATIVE" init -q
          git -C "$NATIVE" remote add origin https://github.com/MatrAIx-ai/MatrAIx-Persona-8B.git
          git -C "$NATIVE" fetch --depth 1 origin "$NATIVE_PIN"
          git -C "$NATIVE" checkout --detach FETCH_HEAD
          test "$(git -C "$NATIVE" rev-parse HEAD)" = "$NATIVE_PIN"
          echo "NATIVE=$NATIVE" >> "$GITHUB_ENV"
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/693eb0bf0000ddb60d684f45d8b5c7b08c4057c0/research/qualification/qualification.py -o "$RUNNER_TEMP/qualification.py"
          echo "885ca37a544577ef708837140834c348c18477db54c301bb4689b07f751ac90e  $RUNNER_TEMP/qualification.py" | sha256sum --check -
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/yejuntak/hcai-deployment-readiness/f6c61a2137c482e85c6562cf28afd9f72f320738/protocol/0.3-preview.1/PROTOCOL.md -o "$RUNNER_TEMP/PROTOCOL.md"
          echo "HARD_PROTOCOL=$RUNNER_TEMP/PROTOCOL.md" >> "$GITHUB_ENV"
      - name: Install CPU and pinned native runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --no-cache-dir 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir 'transformers==4.56.2' "$NATIVE"
          python -m pip freeze
      - name: Verify actual prompts and collect four fresh qualification outputs
        shell: bash
        run: python "$RUNNER_TEMP/qualification.py"
